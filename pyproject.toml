[build-system]
requires = [
    "meson-python",
    "numpy>=2.0.0",
    "packaging",
    "setuptools_scm>=8"
]
build-backend = "mesonpy"

[project]
name = "smopt"
dynamic = ["version"]
description = "Stiefel Manifold Optimization: Penalty-Free First-Order Solvers"
authors = [
    { name = "Saud Zahir", email = "m.saud.zahir@gmail.com" },
]
maintainers = [
    { name = "Saud Zahir", email = "m.saud.zahir@gmail.com" },
    { name = "M Laraib Ali", email = "laraibg786@outlook.com" }
]
readme = "README.md"
license = "GPL-3.0"
keywords = [
    "optimization",
    "manifold optimization",
    "Stiefel manifold",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: C",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy",
]
requires-python = ">=3.10"

[project.urls]
homepage = "https://eggzec.github.io/smopt/"
documentation = "https://eggzec.github.io/smopt/"
source = "https://github.com/eggzec/smopt"
releasenotes = "https://github.com/eggzec/smopt/releases/latest"
issues = "https://github.com/eggzec/smopt/issues"

[dependency-groups]
dev = [
  {include-group = "docs"},
  {include-group = "lint"},
  {include-group = "test"}
]
docs = [
    "zensical>=0.0.42"
]
lint = [
    "ruff==0.15.*",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
include = [ "/smopt" ]

[tool.ruff]
# CI workflow definitions and the build helper scripts they run are not
# part of the published package, so they are out of scope here.
extend-exclude = [".github", "bin"]
line-length = 80
indent-width = 4
preview = true

# Output serialization format for violations. The default serialization
# format is "full" [env: RUFF_OUTPUT_FORMAT=] [possible values:
# concise, full, json, json-lines, junit, grouped, github, gitlab,
# pylint, rdjson, azure, sarif]
output-format = "grouped"

[tool.ruff.lint]
isort.lines-after-imports = 2
isort.split-on-trailing-comma = false

select = [
    "ANN", # flake8-annotations (required strict type annotations for public functions)
    "S",   # flake8-bandit (checks basic security issues in code)
    "BLE", # flake8-blind-except (checks the except blocks that do not specify exception)
    "FBT", # flake8-boolean-trap (ensure that boolean args can be used with kw only)
    "E",   # pycodestyle errors (PEP 8 style guide violations)
    "W",   # pycodestyle warnings (e.g., extra spaces, indentation issues)
    "DOC", # pydoclint issues (e.g., extra or missing return, yield, warnings)
    "A",   # flake8-buitins (check variable and function names to not shadow builtins)
    "N",   # Naming convention checks (e.g., PEP 8 variable and function names)
    "F",   # Pyflakes errors (e.g., unused imports, undefined variables)
    "I",   # isort (Ensures imports are sorted properly)
    "B",   # flake8-bugbear (Detects likely bugs and bad practices)
    "TID", # flake8-tidy-imports (Checks for banned or misplaced imports)
    "UP",  # pyupgrade (Automatically updates old Python syntax)
    "YTT", # flake8-2020 (Detects outdated Python 2/3 compatibility issues)
    "FLY", # flynt (Converts old-style string formatting to f-strings)
    "PIE", # flake8-pie
    "PL",  # pylint
    "RUF", # Ruff-specific rules (Additional optimizations and best practices)
]

ignore = []

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["non-empty-init-module"]
"src/smopt/**/*.py" = [
    # The subpackages are one installable unit, so they reach each other
    # with relative imports rather than by naming the distribution.
    "relative-imports",
    # The solver signatures are fixed by the algorithm this package
    # ports; their arity is not ours to trim.
    "too-many-arguments",
    "too-many-positional-arguments",
    # noqa is the portable spelling, and the one every reader knows.
    "noqa-comments",
]
"tests/*.py" = [
    # A test asserts with assert.
    "assert",
    # Tolerances, sizes and iteration counts read better inline.
    "magic-value-comparison",
    # Annotating every fixture and parametrized case adds no clarity.
    "ANN",
    # The suite mirrors a public API that is deliberately CamelCase, and
    # tests/reference.py is a faithful transcription of the original.
    "invalid-function-name",
    "invalid-argument-name",
    "non-lowercase-variable-in-function",
    "docstring-missing-returns",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    # Parametrizing over a boolean flag is the point of those tests.
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "no-self-use",
    "non-augmented-assignment",
    "compare-to-empty-string",
]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[tool.cibuildwheel]
enable = ["cpython-prerelease"]
